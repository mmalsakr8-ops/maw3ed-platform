<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | موعد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, #263b72 0%, transparent 35%),
        linear-gradient(135deg, #07101f, #0d1830 55%, #111d38);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: rgba(17, 29, 56, 0.96);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      font-size: 32px;
      color: #7c9cff;
    }

    .logo p {
      margin: 8px 0 0;
      color: #aeb9d2;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin: 0 0 24px;
      font-size: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce3f5;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border-radius: 12px;
      border: 1px solid #334363;
      background: #0a1428;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #718cff;
      box-shadow: 0 0 0 3px rgba(113,140,255,.12);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #617cff, #7b5cff);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .error {
      display: block;
      background: rgba(220, 53, 69, .12);
      border: 1px solid rgba(220, 53, 69, .3);
      color: #ff9da7;
    }

    .success {
      display: block;
      background: rgba(40, 167, 69, .12);
      border: 1px solid rgba(40, 167, 69, .3);
      color: #8ee6a1;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 2;
    }

    .links a {
      color: #91a8ff;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;
      margin-top: 8px;
      color: #aeb9d2 !important;
      font-size: 14px;
    }

    .trial {
      margin: 0 0 20px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(97,124,255,.09);
      border: 1px solid rgba(97,124,255,.18);
      color: #cbd5f5;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <h1>موعد</h1>
      <p>موقع مطعمك، منيوك وحجوزاتك في مكان واحد</p>
    </div>

    <h2>إنشاء حساب جديد</h2>

    <div class="trial">
      ابدأ تجربتك المجانية لمدة <strong>14 يومًا</strong>
      بدون الحاجة إلى تأكيد البريد الإلكتروني.
    </div>

    <form id="registerForm">

      <label for="name">الاسم</label>
      <input
        id="name"
        name="name"
        type="text"
        placeholder="اكتب اسمك"
        autocomplete="name"
        required
      >

      <label for="phone">رقم الهاتف</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        placeholder="مثال: 01012345678"
        autocomplete="tel"
        required
      >

      <label for="email">البريد الإلكتروني</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="6 أحرف على الأقل"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="password2">تأكيد كلمة المرور</label>
      <input
        id="password2"
        name="password2"
        type="password"
        placeholder="أعد كتابة كلمة المرور"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button id="submitBtn" type="submit">
        إنشاء الحساب
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
      لديك حساب بالفعل؟
      <a href="/login.html">تسجيل الدخول</a>

      <a class="back" href="/">
        ← العودة إلى الصفحة الرئيسية
      </a>
    </div>

  </div>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      message.className = "message";
      message.textContent = "";

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;

      if (password !== password2) {
        showMessage("كلمتا المرور غير متطابقتين", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري إنشاء الحساب...";

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            name,
            phone,
            email,
            password
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "تعذر إنشاء الحساب");
        }

        showMessage(
          "تم إنشاء الحساب بنجاح، جاري فتح لوحة التحكم...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 800);

      } catch (error) {
        showMessage(
          error.message || "حدث خطأ أثناء إنشاء الحساب",
          "error"
        );

        submitBtn.disabled = false;
        submitBtn.textContent = "إنشاء الحساب";
      }
    });
  </script>

</body>
</html>
