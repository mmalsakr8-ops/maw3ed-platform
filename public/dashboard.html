<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>موعد | لوحة التحكم</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--text:#201e1b;--muted:#77716a;--line:#e8e2da;--accent:#1f1c18;--soft:#f0ece6;--danger:#b42318;--ok:#087443;--shadow:0 14px 40px rgba(0,0,0,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600}.menu-btn{width:44px;height:44px;border-radius:13px;background:var(--soft);font-size:22px}.layout{max-width:1200px;margin:auto;padding:22px}.drawer{position:fixed;top:0;right:-330px;width:310px;height:100vh;background:#fff;z-index:50;padding:20px;box-shadow:-18px 0 50px rgba(0,0,0,.14);transition:.22s;overflow:auto}.drawer.open{right:0}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}.overlay.show{display:block}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:var(--soft);width:40px;height:40px;border-radius:12px}.nav{display:grid;gap:8px}.nav button{background:transparent;text-align:right;padding:14px;border-radius:13px;color:var(--text)}.nav button.active,.nav button:hover{background:var(--soft);font-weight:800}.logout{margin-top:18px;width:100%;background:#fff1f0;color:var(--danger);padding:13px;border-radius:12px}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}.welcome h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:18px}.stat b{font-size:26px;display:block;margin:5px 0}.stat span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:20px;margin-bottom:16px}.card h2,.card h3{margin-top:0}.section{display:none}.section.active{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;outline:none}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--accent);color:#fff;padding:12px 17px;border-radius:12px;font-weight:800}.secondary{background:var(--soft);padding:12px 17px;border-radius:12px;font-weight:700}.danger{background:#fff1f0;color:var(--danger);padding:9px 12px;border-radius:10px}.ok{color:var(--ok);font-weight:800}.msg{margin-top:10px;min-height:22px}.list{display:grid;gap:10px}.row{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.row-main{min-width:0}.row-main b{display:block}.row-main small{color:var(--muted)}.table-wrap{overflow:auto}.data{width:100%;border-collapse:collapse;min-width:720px}.data th,.data td{padding:12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);font-size:12px}.hero{background:var(--accent);color:#fff;border-radius:20px;padding:22px;margin-bottom:18px}.hero .link{direction:ltr;text-align:left;background:rgba(255,255,255,.1);padding:10px;border-radius:10px;overflow:auto;margin-top:12px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.toast{position:fixed;bottom:18px;left:18px;right:18px;max-width:500px;margin:auto;background:#222;color:#fff;padding:13px 16px;border-radius:13px;text-align:center;display:none;z-index:70}.toast.show{display:block}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.welcome{display:block}.fields{grid-template-columns:1fr}}@media(max-width:520px){.layout{padding:14px}.cards{grid-template-columns:1fr 1fr}.stat{padding:14px}.welcome h1{font-size:24px}.card{padding:15px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">م</div><div>موعد<small>MAW3ED</small></div></div><button class="menu-btn" onclick="toggleMenu()">☰</button></header>
<div id="overlay" class="overlay" onclick="toggleMenu(false)"></div>
<aside id="drawer" class="drawer"><div class="drawer-head"><b>القائمة الرئيسية</b><button class="close" onclick="toggleMenu(false)">×</button></div><nav class="nav"><button data-section="home" onclick="show('home')">🏠 الرئيسية</button><button data-section="restaurant" onclick="show('restaurant')">🏪 المطعم</button><button data-section="menu" onclick="show('menu')">📋 المنيو</button><button data-section="tables" onclick="show('tables')">🪑 الطاولات</button><button data-section="reservations" onclick="show('reservations')">📅 الحجوزات</button><button data-section="public" onclick="show('public')">🌐 صفحة المطعم</button><button id="adminNav" style="display:none" onclick="location.href='/admin'">🛡️ الإدارة</button></nav><button class="logout" onclick="logout()">تسجيل الخروج</button></aside>
<main class="layout">
<section id="home" class="section active"><div class="welcome"><div><h1>أهلاً بك 👋</h1><div class="muted">من هنا تدير مطعمك والمنيو والطاولات والحجوزات.</div></div></div><div id="hero"></div><div class="cards"><div class="stat"><span>حالة الموقع</span><b id="sStatus">—</b></div><div class="stat"><span>الاشتراك</span><b id="sSub">—</b></div><div class="stat"><span>الأيام المتبقية</span><b id="sDays">—</b></div><div class="stat"><span>الحجوزات</span><b id="sBookings">—</b></div></div><div class="grid"><div class="card"><h3>اختصارات</h3><div class="actions"><button class="primary" onclick="show('reservations')">📅 الحجوزات</button><button class="secondary" onclick="show('restaurant')">✏️ تعديل المطعم</button><button class="secondary" onclick="show('menu')">📋 إدارة المنيو</button><button class="secondary" onclick="show('tables')">🪑 إدارة الطاولات</button></div></div><div class="card"><h3>رابط المطعم</h3><div id="quickLink" class="muted">—</div><div class="actions"><button class="secondary" onclick="openPublic()">فتح الصفحة</button></div></div></div></section>
<section id="restaurant" class="section"><div class="card"><h2>🏪 بيانات المطعم</h2><div class="fields"><div class="field"><label>اسم المطعم</label><input id="rName"></div><div class="field"><label>رقم الهاتف</label><input id="rPhone"></div><div class="field"><label>العنوان</label><input id="rAddress"></div><div class="field"><label>مواعيد العمل</label><input id="rHours"></div><div class="field full"><label>وصف المطعم</label><textarea id="rDescription"></textarea></div><div class="field"><label>رابط الشعار</label><input id="rLogo"></div><div class="field"><label>رابط الغلاف</label><input id="rCover"></div><div class="field"><label>التصميم</label><select id="rDesign"><option value="default">افتراضي</option><option value="modern">مودرن</option><option value="classic">كلاسيك</option><option value="dark">داكن</option></select></div></div><div class="actions"><button class="primary" onclick="saveRestaurant()">💾 حفظ التعديلات</button></div><div id="restaurantMsg" class="msg"></div></div></section>
<section id="menu" class="section"><div class="grid"><div class="card"><h2>📂 أقسام المنيو</h2><div class="field"><label>اسم القسم</label><input id="catName" placeholder="مثال: المشروبات"></div><div class="actions"><button class="primary" onclick="addCategory()">إضافة قسم</button></div><div id="categories" class="list"></div></div><div class="card"><h2>🍽️ إضافة صنف</h2><div class="fields"><div class="field"><label>اسم الصنف</label><input id="itemName"></div><div class="field"><label>السعر</label><input id="itemPrice" type="number" min="0" step="0.01"></div><div class="field full"><label>الوصف</label><textarea id="itemDesc"></textarea></div><div class="field"><label>رابط الصورة</label><input id="itemImage"></div><div class="field"><label>القسم</label><select id="itemCategory"><option value="">بدون قسم</option></select></div></div><div class="actions"><button class="primary" onclick="addItem()">إضافة الصنف</button></div></div></div><div class="card"><h2>الأصناف الحالية</h2><div id="items" class="list"></div></div></section>
<section id="tables" class="section"><div class="card"><h2>🪑 الطاولات</h2><div class="fields"><div class="field"><label>اسم / رقم الطاولة</label><input id="tableName" placeholder="طاولة 1"></div><div class="field"><label>السعة</label><input id="tableCapacity" type="number" min="1" value="2"></div></div><div class="actions"><button class="primary" onclick="addTable()">إضافة طاولة</button></div><div id="tablesList" class="list" style="margin-top:16px"></div></div></section>
<section id="reservations" class="section"><div class="card"><h2>📅 الحجوزات</h2><div class="actions"><button class="secondary" onclick="loadReservations()">تحديث</button></div><div id="reservationsList" style="margin-top:12px"></div></div></section>
<section id="public" class="section"><div class="card"><h2>🌐 صفحة المطعم</h2><div id="publicInfo"></div></div></section>
</main><div id="toast" class="toast"></div>
<script>
let site=null,categories=[],items=[],tables=[],reservations=[];
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{...(opt.headers||{}),'content-type':'application/json'}});let x={};try{x=await r.json()}catch{}if(!r.ok)throw Error(x.error||'حدث خطأ');return x}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function toggleMenu(force){const open=force===undefined?!$('drawer').classList.contains('open'):force;$('drawer').classList.toggle('open',open);$('overlay').classList.toggle('show',open)}
function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.section===id));toggleMenu(false);if(id==='menu')loadMenu();if(id==='tables')loadTables();if(id==='reservations')loadReservations();if(id==='public')renderPublic()}
async function load(){try{const m=await api('/api/me');if(!m.user){location='/login';return}if(m.user.email==='mmalsakr8@gmail.com'||m.user.role==='admin'||m.user.role==='super_admin') $('adminNav').style.display='block'; const x=await api('/api/site');site=x.site;if(!site){$('hero').innerHTML='<div class="hero"><h2>ابدأ إنشاء موقعك</h2><p>أكمل بيانات المطعم لإنشاء الصفحة العامة.</p><div class="actions"><button class="primary" onclick="show(\'restaurant\')">ابدأ الآن</button></div></div>';return}fillRestaurant();renderHome();await Promise.all([loadMenu(),loadTables(),loadReservations()]);renderPublic()}catch(e){$('hero').innerHTML='<div class="card"><b class="danger">'+esc(e.message)+'</b></div>'}}
function fillRestaurant(){[['rName','name'],['rPhone','phone'],['rAddress','address'],['rHours','working_hours'],['rDescription','description'],['rLogo','logo_url'],['rCover','cover_url'],['rDesign','design']].forEach(([a,b])=>$(a).value=site[b]||'')}
function renderHome(){const active=site.status==='active'&&!site.expired;$('sStatus').textContent=active?'مفعل':'متوقف';$('sSub').textContent=site.subscription_type==='trial'?'تجريبي':site.subscription_type==='3_months'?'3 شهور':site.subscription_type==='1_year'?'سنة':site.subscription_type==='permanent'?'دائم':'—';$('sDays').textContent=site.days_left??'—';$('sBookings').textContent=reservations.length;$('quickLink').textContent=location.origin+'/r/'+site.slug;$('hero').innerHTML='<div class="hero"><h2>'+esc(site.name)+'</h2><p>'+esc(site.description||'أدر مطعمك بالكامل من لوحة واحدة.')+'</p><div class="link">'+esc(location.origin+'/r/'+site.slug)+'</div></div>'}
async function saveRestaurant(){try{const x=await api('/api/site',{method:'PUT',body:JSON.stringify({name:$('rName').value,phone:$('rPhone').value,address:$('rAddress').value,working_hours:$('rHours').value,description:$('rDescription').value,logo_url:$('rLogo').value,cover_url:$('rCover').value,design:$('rDesign').value})});site=x.site;fillRestaurant();renderHome();$('restaurantMsg').innerHTML='<span class="ok">تم حفظ التعديلات ✓</span>';toast('تم حفظ بيانات المطعم')}catch(e){$('restaurantMsg').innerHTML='<span class="danger">'+esc(e.message)+'</span>'}}
async function loadMenu(){try{categories=(await api('/api/categories')).categories||[];const mi=await api('/api/menu-items');items=mi.items||[];renderCategories();renderItems()}catch(e){}}
function renderCategories(){$('categories').innerHTML=categories.length?categories.map(c=>'<div class="row"><div class="row-main"><b>'+esc(c.name)+'</b></div><div><button class="secondary" onclick="editCategory(\''+encodeURIComponent(c.id)+'\')">تعديل</button> <button class="danger" onclick="deleteCategory(\''+encodeURIComponent(c.id)+'\')">حذف</button></div></div>').join(''):'<div class="empty">لا توجد أقسام بعد.</div>';$('itemCategory').innerHTML='<option value="">بدون قسم</option>'+categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')}
async function addCategory(){try{const n=$('catName').value.trim();if(!n)return toast('اكتب اسم القسم');await api('/api/categories',{method:'POST',body:JSON.stringify({name:n})});$('catName').value='';await loadMenu();toast('تمت إضافة القسم')}catch(e){toast(e.message)}}
async function editCategory(id){id=decodeURIComponent(id);const c=categories.find(x=>x.id===id);if(!c)return;const n=prompt('اسم القسم',c.name);if(n===null)return;try{await api('/api/categories/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name:n})});await loadMenu();toast('تم تعديل القسم')}catch(e){toast(e.message)}}
async function deleteCategory(id){id=decodeURIComponent(id);if(!confirm('حذف القسم؟'))return;try{await api('/api/categories/'+encodeURIComponent(id),{method:'DELETE'});await loadMenu();toast('تم حذف القسم')}catch(e){toast(e.message)}}
async function addItem(){try{const n=$('itemName').value.trim();if(!n)return toast('اكتب اسم الصنف');await api('/api/menu-items',{method:'POST',body:JSON.stringify({name:n,price:$('itemPrice').value,description:$('itemDesc').value,image_url:$('itemImage').value,category_id:$('itemCategory').value||null})});['itemName','itemPrice','itemDesc','itemImage'].forEach(id=>$(id).value='');await loadMenu();toast('تمت إضافة الصنف')}catch(e){toast(e.message)}}
function renderItems(){$('items').innerHTML=items.length?items.map(i=>{const c=categories.find(x=>x.id===i.category_id);return '<div class="row"><div class="row-main"><b>'+esc(i.name)+' — '+Number(i.price||0).toFixed(2)+' ج</b><small>'+(c?esc(c.name):'بدون قسم')+' · '+esc(i.description||'')+'</small></div><div><button class="secondary" onclick="editItem(\''+encodeURIComponent(i.id)+'\')">تعديل</button> <button class="danger" onclick="deleteItem(\''+encodeURIComponent(i.id)+'\')">حذف</button></div></div>'}).join(''):'<div class="empty">لا توجد أصناف بعد.</div>'}
async function editItem(id){id=decodeURIComponent(id);const i=items.find(x=>x.id===id);if(!i)return;const name=prompt('اسم الصنف',i.name);if(name===null)return;const price=prompt('السعر',i.price);if(price===null)return;const description=prompt('الوصف',i.description||'');if(description===null)return;try{await api('/api/menu-items/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name,price,description,image_url:i.image_url,category_id:i.category_id,available:!!i.available,sort_order:i.sort_order})});await loadMenu();toast('تم تعديل الصنف')}catch(e){toast(e.message)}}
async function deleteItem(id){id=decodeURIComponent(id);if(!confirm('حذف الصنف؟'))return;try{await api('/api/menu-items/'+encodeURIComponent(id),{method:'DELETE'});await loadMenu();toast('تم حذف الصنف')}catch(e){toast(e.message)}}
async function loadTables(){try{tables=(await api('/api/tables')).tables||[];renderTables();renderHome()}catch(e){}}
function renderTables(){$('tablesList').innerHTML=tables.length?tables.map(t=>'<div class="row"><div class="row-main"><b>'+esc(t.name)+'</b><small>السعة: '+esc(t.capacity)+' · الحالة: '+esc(t.status==='disabled'?'متوقفة':'متاحة')+'</small></div><div><button class="secondary" onclick="editTable(\''+encodeURIComponent(t.id)+'\')">تعديل</button> <button class="danger" onclick="deleteTable(\''+encodeURIComponent(t.id)+'\')">حذف</button></div></div>').join(''):'<div class="empty">لا توجد طاولات بعد.</div>'}
async function addTable(){try{const n=$('tableName').value.trim(),c=Number($('tableCapacity').value);if(!n||c<1)return toast('أدخل اسم الطاولة والسعة');await api('/api/tables',{method:'POST',body:JSON.stringify({name:n,capacity:c})});$('tableName').value='';$('tableCapacity').value=2;await loadTables();toast('تمت إضافة الطاولة')}catch(e){toast(e.message)}}
async function editTable(id){id=decodeURIComponent(id);const t=tables.find(x=>x.id===id);if(!t)return;const n=prompt('اسم الطاولة',t.name);if(n===null)return;const c=prompt('السعة',t.capacity);if(c===null)return;const status=confirm('تفعيل الطاولة؟')?'available':'disabled';try{await api('/api/tables/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name:n,capacity:Number(c),status})});await loadTables();toast('تم تعديل الطاولة')}catch(e){toast(e.message)}}
async function deleteTable(id){id=decodeURIComponent(id);if(!confirm('حذف الطاولة؟'))return;try{await api('/api/tables/'+encodeURIComponent(id),{method:'DELETE'});await loadTables();toast('تم حذف الطاولة')}catch(e){toast(e.message)}}
async function loadReservations(){try{reservations=(await api('/api/reservations')).reservations||[];renderReservations();renderHome()}catch(e){$('reservationsList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function statusLabel(s){return {pending:'قيد المراجعة',confirmed:'مؤكد',completed:'مكتمل',cancelled:'ملغي',rejected:'مرفوض'}[s]||s}
function renderReservations(){$('reservationsList').innerHTML=reservations.length?'<div class="table-wrap"><table class="data"><thead><tr><th>العميل</th><th>التاريخ</th><th>الوقت</th><th>الأشخاص</th><th>الطاولة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+reservations.map(r=>'<tr><td><b>'+esc(r.customer_name)+'</b><br><small>'+esc(r.customer_phone)+'</small></td><td>'+esc(r.reservation_date)+'</td><td>'+esc(r.reservation_time)+'</td><td>'+esc(r.party_size)+'</td><td>'+esc(r.table_name||'تلقائي')+'</td><td><span class="badge">'+esc(statusLabel(r.status))+'</span></td><td><select onchange="changeReservation(\''+encodeURIComponent(r.id)+'\',this.value)"><option value="">تغيير</option><option value="confirmed">تأكيد</option><option value="rejected">رفض</option><option value="completed">مكتمل</option><option value="cancelled">إلغاء</option></select></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">لا توجد حجوزات حتى الآن.</div>'}
async function changeReservation(id,status){if(!status)return;try{await api('/api/reservations/'+encodeURIComponent(decodeURIComponent(id)),{method:'PUT',body:JSON.stringify({status})});await loadReservations();toast('تم تحديث حالة الحجز')}catch(e){toast(e.message)}}
function renderPublic(){if(!site){$('publicInfo').innerHTML='<div class="empty">أنشئ موقع المطعم أولاً.</div>';return}$('publicInfo').innerHTML='<div class="hero"><h2>'+esc(site.name)+'</h2><p>'+esc(site.description||'')+'</p><div class="link">'+esc(location.origin+'/r/'+site.slug)+'</div></div><div class="actions"><button class="primary" onclick="openPublic()">فتح صفحة المطعم</button><button class="secondary" onclick="openBooking()">فتح صفحة الحجز</button></div>'}
function openPublic(){if(site)window.open('/r/'+encodeURIComponent(site.slug),'_blank')}
function openBooking(){if(site)window.open('/book/'+encodeURIComponent(site.slug),'_blank')}
async function logout(){try{await api('/api/logout',{method:'POST'})}finally{location='/login'}}
show('home');load();
</script>
</body></html>
