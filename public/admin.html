<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة MAW3ED</title><style>body{font-family:system-ui,Arial;background:#f5f6fa;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#687386}.badge{padding:5px 9px;border-radius:99px;background:#eef2f7}button,select{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}button{background:#172033;color:#fff}select{background:#fff;color:#172033;border:1px solid #ddd}.err{color:#b42318}</style></head><body><main class="wrap"><div class="top"><div><h1>إدارة MAW3ED</h1><div class="muted">Super Admin</div></div><button onclick="location.href='/dashboard'">العودة</button></div><div id="msg" class="card">جاري التحميل...</div><div id="list" class="grid"></div></main><script>
const msg=document.getElementById('msg'),list=document.getElementById('list');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=x=>x==='3_months'?'3 شهور':x==='1_year'?'سنة':x==='permanent'?'مفتوح للأبد':x||'تجريبي';
async function load(){const r=await fetch('/api/admin/sites');const x=await r.json();if(!r.ok){msg.className='card err';msg.textContent=x.error||'غير مصرح';return}msg.textContent='عدد المطاعم: '+(x.sites||[]).length;list.innerHTML=(x.sites||[]).map(s=>`<article class="card"><h2>${esc(s.name)}</h2><div class="muted">المالك: ${esc(s.owner_name)} — ${esc(s.owner_email)}</div><p>الحالة: <span class="badge">${esc(s.status)}</span></p><p>الاشتراك: <span class="badge">${label(s.subscription_type)}</span></p><p>الانتهاء: ${s.subscription_ends_at?new Date(s.subscription_ends_at).toLocaleString('ar-EG'):'—'}</p><div class="row"><select id="p-${s.id}"><option value="3_months">3 شهور</option><option value="1_year">سنة</option><option value="permanent">مفتوح للأبد</option></select><button onclick="renew('${s.id}')">تجديد</button><button onclick="toggle('${s.id}','${s.status==='active'?'suspended':'active'}')">${s.status==='active'?'إيقاف':'تشغيل'}</button></div></article>`).join('')||'<div class="card">لا توجد مطاعم حتى الآن.</div>'}
async function renew(id){const type=document.getElementById('p-'+id).value;const r=await fetch('/api/admin/site/'+encodeURIComponent(id)+'/renew',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription_type:type})});const x=await r.json();if(!r.ok)return alert(x.error||'تعذر التجديد');load()}
async function toggle(id,status){const r=await fetch('/api/admin/site/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});const x=await r.json();if(!r.ok)return alert(x.error||'تعذر تغيير الحالة');load()}
load();</script></body></html>
