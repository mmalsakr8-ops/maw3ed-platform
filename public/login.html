<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | موعد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, #263b72 0%, transparent 35%),
        linear-gradient(135deg, #07101f, #0d1830 55%, #111d38);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: rgba(17, 29, 56, 0.96);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 30px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      font-size: 32px;
      color: #7c9cff;
    }

    .logo p {
      margin: 8px 0 0;
      color: #aeb9d2;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin: 0 0 24px;
      font-size: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce3f5;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border-radius: 12px;
      border: 1px solid #334363;
      background: #0a1428;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #718cff;
      box-shadow: 0 0 0 3px rgba(113,140,255,.12);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #617cff, #7b5cff);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .error {
      display: block;
      background: rgba(220, 53, 69, .12);
      border: 1px solid rgba(220, 53, 69, .3);
      color: #ff9da7;
    }

    .success {
      display: block;
      background: rgba(40, 167, 69, .12);
      border: 1px solid rgba(40, 167, 69, .3);
      color: #8ee6a1;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 2;
    }

    .links a {
      color: #91a8ff;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;
      margin-top: 8px;
      color: #aeb9d2 !important;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      <h1>موعد</h1>
      <p>موقع مطعمك، منيوك وحجوزاتك في مكان واحد</p>
    </div>

    <h2>تسجيل الدخول</h2>

    <form id="loginForm">

      <label for="login">البريد الإلكتروني أو رقم الهاتف</label>
      <input
        id="login"
        name="login"
        type="text"
        placeholder="أدخل البريد أو رقم الهاتف"
        autocomplete="username"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button id="submitBtn" type="submit">
        تسجيل الدخول
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="links">
      ليس لديك حساب؟
      <a href="/register.html">إنشاء حساب جديد</a>

      <a class="back" href="/">
        ← العودة إلى الصفحة الرئيسية
      </a>
    </div>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      message.className = "message";
      message.textContent = "";

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري تسجيل الدخول...";

      const login = document.getElementById("login").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            login,
            password
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "بيانات تسجيل الدخول غير صحيحة");
        }

        showMessage("تم تسجيل الدخول بنجاح، جاري فتح لوحة التحكم...", "success");

        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 700);

      } catch (error) {
        showMessage(error.message || "حدث خطأ أثناء تسجيل الدخول", "error");

        submitBtn.disabled = false;
        submitBtn.textContent = "تسجيل الدخول";
      }
    });
  </script>

</body>
</html>
